<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMC-268 UI (Team 3)</title>
    <!-- Applies the stored theme before first paint; keep the key in sync with src/shared/lib/theme.ts. -->
    <script id="theme-init">
      try {
        var theme = localStorage.getItem('dmc268.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
